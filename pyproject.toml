[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fever-ir"
version = "0.1.0"
description = "FEVER Evidence Retrieval: TF-IDF vs BM25 vs Dense vs RRF Hybrid"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "scikit-learn",
    "rank-bm25",
    "sentence-transformers",
    "matplotlib",
    "streamlit",
    "pyarrow",
    "pyyaml",
    "tqdm",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
